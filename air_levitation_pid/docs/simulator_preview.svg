<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Segoe UI, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
  <rect width="840" height="440" fill="#eef2f6"/>
  <!-- header -->
  <rect x="0" y="0" width="840" height="44" fill="#ffffff" stroke="#d4dde6"/>
  <text x="16" y="22" font-size="15" font-weight="700" fill="#1f2d3a">空気浮上システム ピンポン球 PID制御シミュレータ</text>
  <text x="16" y="37" font-size="11" fill="#5b7184">PV / SP / PWM ・ KP / TR / TD（教育キット準拠）</text>

  <!-- ===== 左: 装置パネル ===== -->
  <rect x="14" y="58" width="200" height="368" rx="12" fill="#ffffff" stroke="#d4dde6"/>
  <text x="30" y="80" font-size="11" font-weight="700" fill="#1f6fc4" letter-spacing="1">装置</text>
  <!-- tube -->
  <rect x="78" y="92" width="56" height="232" fill="#f4f8fb" stroke="#b9c8d6" stroke-width="2" rx="4"/>
  <g stroke="#dbe6ef" fill="#7c93a7" font-size="8">
    <line x1="78" y1="130" x2="86" y2="130"/><text x="58" y="133">250</text>
    <line x1="78" y1="169" x2="86" y2="169"/><text x="58" y="172">200</text>
    <line x1="78" y1="208" x2="86" y2="208"/><text x="58" y="211">150</text>
    <line x1="78" y1="246" x2="86" y2="246"/><text x="58" y="249">100</text>
    <line x1="78" y1="285" x2="86" y2="285"/><text x="64" y="288">50</text>
  </g>
  <!-- airflow -->
  <g stroke="#e08a00" stroke-width="2" opacity="0.45" fill="none">
    <path d="M92 324 q-3 -12 0 -24"/><path d="M106 324 q-3 -12 0 -24"/><path d="M120 324 q-3 -12 0 -24"/>
  </g>
  <!-- SP dashed -->
  <line x1="74" y1="208" x2="138" y2="208" stroke="#2e7dd1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="140" y="211" font-size="9" fill="#2e7dd1" font-weight="700">SP</text>
  <!-- ball at ~150 -->
  <circle cx="106" cy="210" r="13" fill="#ff9a4d" stroke="#c96b22" stroke-width="1.3"/>
  <circle cx="101" cy="205" r="4" fill="#ffd9a0" opacity="0.8"/>
  <!-- fan -->
  <rect x="70" y="324" width="72" height="22" fill="#dfe8f0" stroke="#b9c8d6" rx="3"/>
  <g transform="translate(106,335)" fill="#e08a00"><rect x="-1.5" y="0" width="3" height="9"/><rect x="0" y="-1.5" width="9" height="3"/><rect x="-1.5" y="-9" width="3" height="9"/><rect x="-9" y="-1.5" width="9" height="3"/></g>
  <text x="106" y="358" text-anchor="middle" font-size="8" fill="#7c93a7">FAN</text>
  <!-- readouts -->
  <g font-size="9" fill="#5b7184">
    <rect x="30" y="368" width="84" height="24" rx="5" fill="#f1f5f9"/><text x="36" y="379">PV 現在値</text><text x="36" y="390" font-size="14" font-weight="700" fill="#e23b3b">150.7</text>
    <rect x="118" y="368" width="84" height="24" rx="5" fill="#f1f5f9"/><text x="124" y="379">SP 設定値</text><text x="124" y="390" font-size="14" font-weight="700" fill="#2e7dd1">150</text>
    <rect x="30" y="396" width="84" height="24" rx="5" fill="#f1f5f9"/><text x="36" y="407">PWM_OUT</text><text x="36" y="418" font-size="14" font-weight="700" fill="#e08a00">162</text>
    <rect x="118" y="396" width="84" height="24" rx="5" fill="#f1f5f9"/><text x="124" y="407">偏差 e</text><text x="124" y="418" font-size="14" font-weight="700" fill="#1f2d3a">-0.7</text>
  </g>

  <!-- ===== 右: グラフパネル ===== -->
  <rect x="226" y="58" width="600" height="368" rx="12" fill="#ffffff" stroke="#d4dde6"/>
  <text x="244" y="80" font-size="11" font-weight="700" fill="#1f6fc4" letter-spacing="1">リアルタイムグラフ（グラフィカル画面）</text>
  <!-- legend -->
  <g font-size="10" fill="#5b7184">
    <rect x="244" y="90" width="14" height="3" fill="#2e7dd1"/><text x="262" y="96">SP 設定値</text>
    <rect x="330" y="90" width="14" height="3" fill="#e23b3b"/><text x="348" y="96">PV 現在値</text>
    <rect x="416" y="90" width="14" height="3" fill="#e08a00"/><text x="434" y="96">PWM出力</text>
  </g>

  <!-- chart inner area: X 470..800 won't fit; remap to 250..800. Use group translate -->
  <g transform="translate(-220,40)">
    <!-- inner X0=470 Y0=70 W=330 H=215 -->
    <rect x="470" y="70" width="330" height="215" fill="#f8fafc" stroke="#cdd9e4"/>
    <!-- grid + left axis (height 0..300) -->
    <g stroke="#e6edf3" fill="#7c93a7" font-size="9">
      <line x1="470" y1="70"  x2="800" y2="70"/><text x="450" y="73" text-anchor="end">300</text>
      <line x1="470" y1="105.8" x2="800" y2="105.8"/><text x="450" y="109" text-anchor="end">250</text>
      <line x1="470" y1="141.7" x2="800" y2="141.7"/><text x="450" y="145" text-anchor="end">200</text>
      <line x1="470" y1="177.5" x2="800" y2="177.5"/><text x="450" y="181" text-anchor="end">150</text>
      <line x1="470" y1="213.3" x2="800" y2="213.3"/><text x="450" y="217" text-anchor="end">100</text>
      <line x1="470" y1="249.2" x2="800" y2="249.2"/><text x="455" y="253" text-anchor="end">50</text>
      <line x1="470" y1="285" x2="800" y2="285"/><text x="458" y="288" text-anchor="end">0</text>
    </g>
    <!-- right axis PWM 0..255 -->
    <g fill="#e08a00" font-size="9">
      <text x="806" y="73">255</text><text x="806" y="145">153</text><text x="806" y="217">51</text><text x="806" y="288">0</text>
    </g>
    <text x="438" y="178" font-size="10" fill="#7c93a7" transform="rotate(-90 438 178)" text-anchor="middle">高さ PV/SP</text>
    <!-- PWM curve -->
    <polyline fill="none" stroke="#e08a00" stroke-width="1.5" points="470.0,70.0 478.8,70.0 489.8,70.0 500.9,70.7 511.9,70.4 522.9,70.7 533.9,70.0 544.9,70.3 555.9,70.0 567.0,70.7 578.0,70.4 589.0,71.5 600.0,73.8 611.0,77.0 622.1,81.0 633.1,85.5 644.1,90.4 655.1,95.5 666.1,100.7 677.1,105.9 688.2,111.0 699.2,115.9 710.2,120.5 721.2,124.9 732.2,128.8 743.3,132.4 754.3,135.5 765.3,138.2 776.3,140.4 787.3,142.1 798.3,143.4"/>
    <!-- SP line -->
    <line x1="470" y1="177.5" x2="800" y2="177.5" stroke="#2e7dd1" stroke-width="2"/>
    <!-- PV curve -->
    <polyline fill="none" stroke="#e23b3b" stroke-width="2" points="470.0,285.0 478.8,283.0 489.8,276.9 500.9,268.4 511.9,258.7 522.9,248.6 533.9,238.7 544.9,229.4 555.9,220.9 567.0,213.2 578.0,206.2 589.0,200.0 600.0,194.5 611.0,189.7 622.1,185.5 633.1,181.9 644.1,178.9 655.1,176.3 666.1,174.2 677.1,172.5 688.2,171.2 699.2,170.3 710.2,169.6 721.2,169.2 732.2,169.0 743.3,169.1 754.3,169.3 765.3,169.7 776.3,170.2 787.3,170.8 798.3,171.5"/>
  </g>

  <!-- mode chip -->
  <rect x="700" y="74" width="116" height="22" rx="6" fill="#2e7dd1"/>
  <circle cx="713" cy="85" r="5" fill="#9be7c4"/>
  <text x="724" y="89" font-size="11" fill="#ffffff" font-weight="700">PID 有効</text>
</svg>
