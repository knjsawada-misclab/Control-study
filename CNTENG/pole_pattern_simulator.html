<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極配置パターン比較シミュレータ（除振台）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
  background: #eef2f6;
  color: #1f2d3a;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #d4dde6;
  padding: 10px 20px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-shrink: 0;
}
header h1 { font-size: 1rem; font-weight: 600; color: #2e7dd1; }
header .eq { font-size: 0.78rem; color: #5b7184; font-family: 'Courier New', monospace; }

.body { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 320px;
  background: #ffffff;
  border-right: 1px solid #d4dde6;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar-inner { padding: 12px; flex: 1; }

.section { margin-bottom: 14px; }
.sec-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #2e7dd1;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e2e8f0;
}

select {
  width: 100%;
  background: #f1f5f9;
  border: 1px solid #d4dde6;
  color: #1f2d3a;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 0.82rem;
  cursor: pointer;
}
select:focus { outline: none; border-color: #2e7dd1; }

.matrix-label { font-size: 0.75rem; color: #5b7184; margin-bottom: 5px; }
.mat-grid { display: grid; gap: 5px; margin-bottom: 8px; }
.mat-2x2 { grid-template-columns: 1fr 1fr; }
.mat-2x1 { grid-template-columns: 1fr; }

input[type="number"] {
  background: #f1f5f9;
  border: 1px solid #d4dde6;
  color: #1f2d3a;
  padding: 5px 6px;
  border-radius: 5px;
  width: 100%;
  font-size: 0.82rem;
  text-align: center;
  font-family: 'Courier New', monospace;
  transition: border-color 0.15s;
}
input[type="number"]:focus { outline: none; border-color: #2e7dd1; }

.input-label { font-size: 0.7rem; color: #5b7184; margin-bottom: 2px; }

.pole-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }
.pole-row.three-col { grid-template-columns: 1fr 1fr 1fr; }
.pole-field label { display: block; font-size: 0.7rem; color: #5b7184; margin-bottom: 3px; }

.note-text { font-size: 0.68rem; color: #5b7184; margin-top: 2px; margin-bottom: 6px; font-style: italic; }

.btn-compute {
  width: 100%;
  background: #16a34a;
  color: #fff;
  border: none;
  padding: 9px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 12px;
}
.btn-compute:hover { background: #15803d; }
.btn-compute:active { background: #166534; }

.result-box {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 10px;
  font-family: 'Courier New', monospace;
  font-size: 0.75rem;
  line-height: 1.5;
}
.res-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.res-key { color: #5b7184; }
.res-val { color: #2e7dd1; }
.res-val.stable { color: #16a34a; }
.res-val.unstable { color: #dc2626; }
.res-sep { border: none; border-top: 1px solid #e2e8f0; margin: 6px 0; }
.error-msg { color: #dc2626; font-size: 0.78rem; margin-top: 6px; min-height: 16px; }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.72rem;
  font-weight: 600;
}
.badge.ctrl { background: rgba(22,163,74,0.12); color: #16a34a; border: 1px solid #16a34a; }
.badge.stab { background: rgba(245,158,11,0.12); color: #d97706; border: 1px solid #d97706; }
.badge.unstab { background: rgba(220,38,38,0.12); color: #dc2626; border: 1px solid #dc2626; }

/* Pattern checkbox list */
.pattern-list { margin-bottom: 8px; }
.pattern-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  margin-bottom: 3px;
  cursor: pointer;
  transition: background 0.12s;
}
.pattern-item:hover { background: #f1f5f9; }
.pattern-item input[type="checkbox"] {
  width: 15px;
  height: 15px;
  cursor: pointer;
  accent-color: var(--pat-color);
  flex-shrink: 0;
}
.pattern-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}
.pattern-label {
  font-size: 0.78rem;
  color: #1f2d3a;
  flex: 1;
}
.pattern-zeta {
  font-size: 0.68rem;
  color: #5b7184;
  font-family: 'Courier New', monospace;
}
.custom-zeta-input {
  width: 52px;
  font-size: 0.75rem;
  padding: 3px 4px;
}

/* Results table */
.results-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.68rem;
  font-family: 'Courier New', monospace;
}
.results-table th {
  background: #e2e8f0;
  color: #5b7184;
  font-weight: 600;
  padding: 4px 5px;
  text-align: left;
  font-size: 0.62rem;
  border-bottom: 1px solid #d4dde6;
}
.results-table td {
  padding: 3px 5px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: top;
}
.results-table tr:hover { background: #f8fafc; }
.result-name {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size: 0.68rem;
  font-weight: 600;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 10px;
  overflow: hidden;
}
.plots-row {
  flex: 1;
  display: flex;
  gap: 10px;
  overflow: hidden;
}
.plot-card {
  flex: 1;
  background: #ffffff;
  border: 1px solid #d4dde6;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.plot-card.splane-panel { flex: 0 0 auto; width: 45%; }
.plot-card.response-panel { flex: 1; }
.plot-card.bar-panel { flex: none; height: 180px; }
.plot-card.anim-panel { flex: none; height: 220px; }

.anim-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-top: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.btn-play {
  background: #2e7dd1;
  color: #fff;
  border: none;
  padding: 4px 14px;
  border-radius: 5px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-play:hover { background: #1d6ab8; }
.speed-label { font-size: 0.7rem; color: #5b7184; }
.speed-slider {
  width: 70px;
  cursor: pointer;
}
.anim-info {
  font-size: 0.7rem;
  color: #5b7184;
  font-family: 'Courier New', monospace;
  margin-left: auto;
}

.plot-header {
  padding: 8px 12px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.plot-title { font-size: 0.8rem; font-weight: 600; color: #1f2d3a; }
.plot-sub { font-size: 0.7rem; color: #5b7184; }

.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding: 0 12px 6px;
  flex-shrink: 0;
}
.leg-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #5b7184; }
.leg-icon { width: 14px; text-align: center; font-size: 0.8rem; }
.leg-line { width: 14px; height: 2px; }

canvas {
  flex: 1;
  width: 100%;
  display: block;
}

/* Narrow desktop / landscape tablet */
@media (max-width: 1024px) {
  .sidebar { width: 260px; }
  .plot-card.splane-panel { width: 42%; }
}

/* Tablet / Mobile */
@media (max-width: 820px) {
  body {
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-y: auto;
  }
  header {
    flex-wrap: wrap;
    padding: 8px 12px;
    gap: 4px;
  }
  header h1 { font-size: 0.9rem; }
  header .eq { font-size: 0.65rem; line-height: 1.5; display: block; }
  .body {
    flex-direction: column;
    overflow: visible;
    flex: none;
  }
  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #d4dde6;
    overflow-y: visible;
    max-height: none;
  }
  .sidebar-inner { padding: 10px; }
  .section { margin-bottom: 10px; }
  .mat-grid { gap: 3px; }
  .main {
    overflow: visible;
    flex: none;
    padding: 8px;
  }
  .plots-row {
    flex-direction: column;
    overflow: visible;
    flex-shrink: 0;
    gap: 8px;
  }
  .plot-card.splane-panel {
    width: 100% !important;
    height: min(80vw, 350px);
    flex: none;
  }
  .plot-card.response-panel {
    width: 100% !important;
    height: min(70vw, 300px);
    flex: none;
  }
  .plot-card.bar-panel {
    width: 100% !important;
    height: 200px;
    flex: none;
  }
  .plot-card.anim-panel {
    width: 100% !important;
    height: min(75vw, 300px);
    flex: none;
  }
  canvas {
    flex: 1 1 0 !important;
    width: 100% !important;
    min-height: 0 !important;
  }
  .anim-controls {
    gap: 4px;
    padding: 4px 8px;
    flex-wrap: wrap;
  }
  .btn-play {
    padding: 6px 16px;
    min-height: 36px;
  }
  .legend {
    gap: 4px 8px;
    padding: 4px 8px;
    flex-wrap: wrap;
  }
  .leg-item { font-size: 0.6rem; }
  .plot-header {
    flex-wrap: wrap;
    gap: 2px;
    padding: 6px 8px 2px;
  }
  .plot-title { font-size: 0.75rem; }
  .plot-sub { font-size: 0.62rem; }
  .info-bar {
    flex-wrap: wrap;
    gap: 4px;
    font-size: 0.6rem;
    padding: 6px 10px;
  }
  input[type="number"],
  select {
    font-size: 16px;
  }
  input[type="number"] {
    padding: 7px 6px;
  }
  .btn-compute {
    padding: 12px;
    font-size: 0.9rem;
    min-height: 44px;
  }
  .result-box {
    font-size: 0.7rem;
    overflow: hidden;
  }
  .res-row {
    gap: 2px 4px;
  }
  .res-key {
    flex-shrink: 0;
  }
  .res-val {
    flex: 1;
    min-width: 0;
    font-size: 0.66rem;
    overflow-wrap: anywhere;
  }
  .badge {
    font-size: 0.68rem;
  }
  .pole-row {
    gap: 4px;
  }
}

.info-bar {
  background: #ffffff;
  border-top: 1px solid #d4dde6;
  padding: 5px 16px;
  font-size: 0.7rem;
  color: #5b7184;
  flex-shrink: 0;
  display: flex;
  gap: 20px;
}
</style>
</head>
<body>

<header>
  <h1>極配置パターン比較シミュレータ</h1>
  <span class="eq">s&sup2; + 2&zeta;&omega;<sub>n</sub>s + &omega;<sub>n</sub>&sup2; = 0</span>
</header>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-inner">

      <div class="section">
        <div class="sec-title">物理パラメータ</div>
        <div class="pole-row three-col">
          <div class="pole-field">
            <label>質量 m [kg]</label>
            <input type="number" id="param_m" value="1" step="0.1" min="0.1">
          </div>
          <div class="pole-field">
            <label>減衰 d [Ns/m]</label>
            <input type="number" id="param_d" value="0.5" step="0.1" min="0">
          </div>
          <div class="pole-field">
            <label>ばね k [N/m]</label>
            <input type="number" id="param_k" value="4" step="0.1" min="0">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="sec-title">設計パラメータ &omega;<sub>n</sub></div>
        <div class="pole-row">
          <div class="pole-field">
            <label>&omega;<sub>n</sub> [rad/s]</label>
            <input type="number" id="param_wn" value="3" step="0.1" min="0.1">
          </div>
          <div class="pole-field" style="display:flex;align-items:flex-end;">
            <span class="note-text" style="margin-bottom:6px;">応答速度の指標</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="sec-title">極配置パターン（複数選択）</div>
        <div class="pattern-list">
          <label class="pattern-item">
            <input type="checkbox" id="chk_butterworth" checked style="--pat-color:#2e7dd1;">
            <div class="pattern-swatch" style="background:#2e7dd1;"></div>
            <span class="pattern-label">Butterworth</span>
            <span class="pattern-zeta">&zeta;=0.707</span>
          </label>
          <label class="pattern-item">
            <input type="checkbox" id="chk_critical" checked style="--pat-color:#f59e0b;">
            <div class="pattern-swatch" style="background:#f59e0b;"></div>
            <span class="pattern-label">臨界減衰</span>
            <span class="pattern-zeta">&zeta;=1.0</span>
          </label>
          <label class="pattern-item">
            <input type="checkbox" id="chk_bessel" style="--pat-color:#16a34a;">
            <div class="pattern-swatch" style="background:#16a34a;"></div>
            <span class="pattern-label">Bessel</span>
            <span class="pattern-zeta">&zeta;=0.866</span>
          </label>
          <label class="pattern-item">
            <input type="checkbox" id="chk_underdamped" style="--pat-color:#dc2626;">
            <div class="pattern-swatch" style="background:#dc2626;"></div>
            <span class="pattern-label">不足減衰</span>
            <span class="pattern-zeta">&zeta;=0.3</span>
          </label>
          <label class="pattern-item">
            <input type="checkbox" id="chk_overdamped" style="--pat-color:#8b5cf6;">
            <div class="pattern-swatch" style="background:#8b5cf6;"></div>
            <span class="pattern-label">過減衰</span>
            <span class="pattern-zeta">&zeta;=1.5</span>
          </label>
          <label class="pattern-item">
            <input type="checkbox" id="chk_custom" style="--pat-color:#64748b;">
            <div class="pattern-swatch" style="background:#64748b;"></div>
            <span class="pattern-label">カスタム</span>
            <span class="pattern-zeta">&zeta;=</span>
            <input type="number" id="custom_zeta" class="custom-zeta-input" value="0.5" step="0.01" min="0.01" onclick="event.stopPropagation();">
          </label>
        </div>
      </div>

      <div class="section">
        <div class="sec-title">外乱</div>
        <select id="dist_type">
          <option value="step" selected>ステップ (1(t))</option>
          <option value="impulse">インパルス (delta(t))</option>
        </select>
      </div>

      <div class="section">
        <div class="sec-title">シミュレーション</div>
        <div class="pole-row">
          <div class="pole-field">
            <label>終了時刻 T [s]</label>
            <input type="number" id="tEnd" value="8" step="1" min="0.5">
          </div>
          <div class="pole-field">
            <label>刻み幅 dt</label>
            <input type="number" id="dt" value="0.01" step="0.001" min="0.001" max="0.1">
          </div>
        </div>
      </div>

      <button class="btn-compute" onclick="runSimulation()">&#x25B6; 計算・比較</button>

      <div class="section">
        <div class="sec-title">比較結果</div>
        <div id="result-box" class="result-box" style="overflow-x:auto;">
          <div style="color:#5b7184;">「計算・比較」を押してください</div>
        </div>
        <div id="error-msg" class="error-msg"></div>
      </div>

    </div>
  </div>

  <div class="main">
    <div class="plot-card anim-panel">
      <div class="plot-header">
        <span class="plot-title">除振台アニメーション</span>
        <span class="plot-sub" id="anim-sub"></span>
      </div>
      <canvas id="animCanvas"></canvas>
      <div class="anim-controls">
        <button class="btn-play" id="btn-play" onclick="togglePlay()">&#x25B6;</button>
        <span class="speed-label">速度:</span>
        <input type="range" class="speed-slider" id="speed" min="0" max="2" step="1" value="1">
        <span class="speed-label" id="speed-label">1x</span>
        <span class="anim-info" id="anim-info">t=0.00</span>
      </div>
    </div>

    <div class="plots-row">
      <div class="plot-card splane-panel">
        <div class="plot-header">
          <span class="plot-title">極配置図（s平面）</span>
          <span class="plot-sub">左半面 = 安定領域</span>
        </div>
        <div class="legend" id="splane-legend"></div>
        <canvas id="splaneCanvas"></canvas>
      </div>

      <div class="plot-card response-panel">
        <div class="plot-header">
          <span class="plot-title" id="resp-title">ステップ応答 y(t)</span>
          <span class="plot-sub">外乱 f(t) から変位 y(t)</span>
        </div>
        <div class="legend" id="resp-legend"></div>
        <canvas id="responseCanvas"></canvas>
      </div>
    </div>

    <div class="plot-card bar-panel">
      <div class="plot-header">
        <span class="plot-title">性能指標比較</span>
        <span class="plot-sub">オーバーシュート [%] / 整定時間 [s]</span>
      </div>
      <canvas id="barCanvas"></canvas>
    </div>
  </div>
</div>

<div class="info-bar">
  <span>アクティブ除振台の極配置パターン比較 &nbsp;|&nbsp; RK4 数値積分</span>
  <span id="ctrl-info"></span>
</div>

<script>
// =========================================================
// パターン定義
// =========================================================
var PATTERNS = [
  { id: 'butterworth', name: 'Butterworth',  nameJa: 'バタワース', zeta: 1/Math.sqrt(2), color: '#2e7dd1' },
  { id: 'critical',    name: '臨界減衰',      nameJa: '重根',       zeta: 1.0,             color: '#f59e0b' },
  { id: 'bessel',      name: 'Bessel',        nameJa: 'ベッセル',   zeta: Math.sqrt(3)/2,  color: '#16a34a' },
  { id: 'underdamped', name: '不足減衰',      nameJa: '振動的',     zeta: 0.3,             color: '#dc2626' },
  { id: 'overdamped',  name: '過減衰',        nameJa: '',           zeta: 1.5,             color: '#8b5cf6' },
  { id: 'custom',      name: 'カスタム',      nameJa: '',           zeta: 0.5,             color: '#64748b' }
];

// =========================================================
// グローバル状態
// =========================================================
var simResults = null;
var animFrame = 0;
var animPlaying = false;
var animRAF = null;
var lastAnimTime = 0;

// =========================================================
// ユーティリティ
// =========================================================
function fN(v) {
  if (!isFinite(v)) return 'Inf';
  if (Number.isInteger(v) || Math.abs(v - Math.round(v)) < 1e-10) return String(Math.round(v));
  return v.toFixed(4);
}

function fN2(v) {
  if (!isFinite(v)) return 'Inf';
  if (Number.isInteger(v) || Math.abs(v - Math.round(v)) < 1e-10) return String(Math.round(v));
  return v.toFixed(2);
}

function fN3(v) {
  if (!isFinite(v)) return 'Inf';
  return v.toFixed(3);
}

// =========================================================
// パラメータ読み取り
// =========================================================
function getParams() {
  var m  = Math.max(+document.getElementById('param_m').value, 0.01);
  var d  = Math.max(+document.getElementById('param_d').value, 0);
  var k  = Math.max(+document.getElementById('param_k').value, 0);
  var wn = Math.max(+document.getElementById('param_wn').value, 0.01);
  var distType = document.getElementById('dist_type').value;
  var tEnd = Math.max(+document.getElementById('tEnd').value, 0.1);
  var dt = Math.min(Math.max(+document.getElementById('dt').value, 0.0001), 0.5);
  return { m: m, d: d, k: k, wn: wn, distType: distType, tEnd: tEnd, dt: dt };
}

function getActivePatterns() {
  var active = [];
  for (var i = 0; i < PATTERNS.length; i++) {
    var p = PATTERNS[i];
    var chk = document.getElementById('chk_' + p.id);
    if (chk && chk.checked) {
      var zeta = p.zeta;
      if (p.id === 'custom') {
        zeta = Math.max(+document.getElementById('custom_zeta').value, 0.01);
      }
      active.push({
        id: p.id,
        name: p.name,
        nameJa: p.nameJa,
        zeta: zeta,
        color: p.color
      });
    }
  }
  return active;
}

// =========================================================
// PD ゲイン算出: given zeta, wn, m, d, k
// cd = 2*zeta*wn*m - d
// cp = wn^2*m - k
// =========================================================
function computeGains(zeta, wn, m, d, k) {
  var cd = 2 * zeta * wn * m - d;
  var cp = wn * wn * m - k;
  return { cp: cp, cd: cd };
}

// =========================================================
// 極の計算
// s = -zeta*wn +/- wn*sqrt(zeta^2 - 1)
// =========================================================
function computePoles(zeta, wn) {
  var disc = zeta * zeta - 1;
  if (disc >= -1e-14) {
    var sqrtDisc = Math.sqrt(Math.max(0, disc));
    return [
      { re: -zeta * wn + wn * sqrtDisc, im: 0 },
      { re: -zeta * wn - wn * sqrtDisc, im: 0 }
    ];
  } else {
    var wd = wn * Math.sqrt(-disc);
    return [
      { re: -zeta * wn, im: wd },
      { re: -zeta * wn, im: -wd }
    ];
  }
}

function fmtPole(poles) {
  if (Math.abs(poles[0].im) < 1e-6) {
    if (Math.abs(poles[0].re - poles[1].re) < 1e-6) {
      return fN3(poles[0].re) + ' (2重根)';
    }
    return fN3(poles[0].re) + ', ' + fN3(poles[1].re);
  }
  return fN3(poles[0].re) + ' ± j' + fN3(Math.abs(poles[0].im));
}

// =========================================================
// 外乱関数
// =========================================================
function disturbance(t, dt, distType) {
  if (distType === 'impulse') {
    return (t >= 0 && t < dt) ? -1/dt : 0;
  } else {
    return t >= 0 ? -1 : 0;
  }
}

// =========================================================
// RK4 シミュレーション
// =========================================================
function simulate(m, d, k, cp, cd, distType, tEnd, dt) {
  var steps = Math.ceil(tEnd / dt);
  var n = steps + 1;
  var tArr = new Float64Array(n);
  var yArr = new Float64Array(n);

  var x = [0, 0];
  var CLIP = 1e6;

  for (var i = 0; i < n; i++) {
    var t = i * dt;
    tArr[i] = t;
    yArr[i] = x[0];

    if (i === n - 1) break;

    var f = function(xx, tt) {
      var uu = cp * xx[0] + cd * xx[1];
      var ff = disturbance(tt, dt, distType);
      return [
        xx[1],
        (-k/m)*xx[0] + (-d/m)*xx[1] + (-1/m)*uu + (1/m)*ff
      ];
    };

    var k1 = f(x, t);
    var x2 = [x[0]+0.5*dt*k1[0], x[1]+0.5*dt*k1[1]];
    var k2 = f(x2, t+0.5*dt);
    var x3 = [x[0]+0.5*dt*k2[0], x[1]+0.5*dt*k2[1]];
    var k3 = f(x3, t+0.5*dt);
    var x4 = [x[0]+dt*k3[0], x[1]+dt*k3[1]];
    var k4 = f(x4, t+dt);

    x[0] += (dt/6)*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
    x[1] += (dt/6)*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);

    if (!isFinite(x[0]) || Math.abs(x[0]) > CLIP) x[0] = CLIP * (x[0] > 0 ? 1 : -1);
    if (!isFinite(x[1]) || Math.abs(x[1]) > CLIP) x[1] = CLIP * (x[1] > 0 ? 1 : -1);
  }

  return { t: tArr, y: yArr };
}

// =========================================================
// 性能指標の計算
// =========================================================
function computePerformance(sim, cp, k, distType) {
  var yss, overshoot, settlingTime;

  if (distType === 'step') {
    // Steady-state: y_ss = -1/(k+cp)
    yss = -1 / (k + cp);

    // Find peak overshoot beyond y_ss
    // y(0)=0, response moves toward y_ss. Overshoot = going past y_ss.
    // OS% = |y_peak - y_ss| / |y_ss| * 100, where y_peak overshoots past y_ss.
    // For y_ss < 0: overshoot means y < y_ss (more negative), so (y_ss - y_peak) > 0
    // For y_ss > 0: overshoot means y > y_ss, so (y_peak - y_ss) > 0
    // General: overshoot distance = |y_peak - y_ss| for the extremum past y_ss
    var yPeak = yss; // start with no overshoot
    for (var i = 0; i < sim.y.length; i++) {
      if (yss < 0) {
        if (sim.y[i] < yPeak) yPeak = sim.y[i];
      } else {
        if (sim.y[i] > yPeak) yPeak = sim.y[i];
      }
    }
    overshoot = Math.abs(yPeak - yss) / Math.abs(yss) * 100;

    // Settling time (2% criterion)
    var band = 0.02 * Math.abs(yss);
    settlingTime = 0;
    for (var i = sim.y.length - 1; i >= 0; i--) {
      if (Math.abs(sim.y[i] - yss) > band) {
        settlingTime = sim.t[i];
        break;
      }
    }
  } else {
    // Impulse: yss = 0
    yss = 0;

    // Find peak absolute value
    var yPeakAbs = 0;
    for (var i = 0; i < sim.y.length; i++) {
      if (Math.abs(sim.y[i]) > yPeakAbs) yPeakAbs = Math.abs(sim.y[i]);
    }
    overshoot = NaN; // Not meaningful for impulse

    // Settling time: last time |y(t)| > 2% of peak
    var band2 = 0.02 * yPeakAbs;
    settlingTime = 0;
    if (yPeakAbs > 1e-10) {
      for (var i = sim.y.length - 1; i >= 0; i--) {
        if (Math.abs(sim.y[i]) > band2) {
          settlingTime = sim.t[i];
          break;
        }
      }
    }
  }

  return { yss: yss, overshoot: overshoot, settlingTime: settlingTime };
}

// =========================================================
// メインシミュレーション
// =========================================================
function runSimulation() {
  stopAnimation();
  var params = getParams();
  var active = getActivePatterns();

  if (active.length === 0) {
    document.getElementById('error-msg').textContent = 'パターンを1つ以上選択してください';
    return;
  }
  document.getElementById('error-msg').textContent = '';

  var results = [];
  for (var i = 0; i < active.length; i++) {
    var pat = active[i];
    var gains = computeGains(pat.zeta, params.wn, params.m, params.d, params.k);
    var poles = computePoles(pat.zeta, params.wn);
    var sim = simulate(params.m, params.d, params.k, gains.cp, gains.cd, params.distType, params.tEnd, params.dt);
    var perf = computePerformance(sim, gains.cp, params.k, params.distType);

    results.push({
      pattern: pat,
      gains: gains,
      poles: poles,
      sim: sim,
      perf: perf
    });
  }

  simResults = { params: params, results: results };

  // Update title
  document.getElementById('resp-title').textContent =
    params.distType === 'step' ? 'ステップ応答 y(t)' : 'インパルス応答 y(t)';

  updateLegends();
  updateResultsTable();
  drawSplane();
  drawResponse();
  drawBarChart();

  // Animation
  animFrame = 0;
  drawAnimPanel();
  updateAnimInfo();
  // Auto-start animation
  togglePlay();

  // Info bar
  document.getElementById('ctrl-info').textContent =
    active.length + ' パターン比較 | ωn = ' + fN2(params.wn) + ' rad/s';
}

// =========================================================
// 凡例更新
// =========================================================
function updateLegends() {
  if (!simResults) return;
  var results = simResults.results;

  // s-plane legend
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div class="leg-item"><span class="leg-icon" style="color:' + r.pattern.color + ';">&#x25CF;</span> ' +
      r.pattern.name + ' (ζ=' + fN3(r.pattern.zeta) + ')</div>';
  }
  document.getElementById('splane-legend').innerHTML = html;

  // response legend
  html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div class="leg-item"><div class="leg-line" style="background:' + r.pattern.color + ';"></div> ' +
      r.pattern.name + '</div>';
  }
  document.getElementById('resp-legend').innerHTML = html;
}

// =========================================================
// 結果テーブル更新
// =========================================================
function updateResultsTable() {
  if (!simResults) return;
  var results = simResults.results;
  var isStep = simResults.params.distType === 'step';

  var html = '<table class="results-table">';
  html += '<tr><th>パターン</th><th>ζ</th><th>極</th><th>cp</th><th>cd</th>';
  if (isStep) html += '<th>OS%</th>';
  html += '<th>Ts [s]</th></tr>';

  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<tr>';
    html += '<td><span class="result-name" style="color:' + r.pattern.color + ';">' + r.pattern.name + '</span></td>';
    html += '<td>' + fN3(r.pattern.zeta) + '</td>';
    html += '<td style="font-size:0.6rem;">' + fmtPole(r.poles) + '</td>';
    html += '<td>' + fN2(r.gains.cp) + '</td>';
    html += '<td>' + fN2(r.gains.cd) + '</td>';
    if (isStep) {
      html += '<td>' + (isNaN(r.perf.overshoot) ? '-' : fN2(r.perf.overshoot)) + '</td>';
    }
    html += '<td>' + fN2(r.perf.settlingTime) + '</td>';
    html += '</tr>';
  }

  html += '</table>';
  document.getElementById('result-box').innerHTML = html;
}

// =========================================================
// s平面描画
// =========================================================
function drawSplane() {
  var canvas = document.getElementById('splaneCanvas');
  var par = canvas.parentElement;
  var legendH = par.querySelector('.legend') ? par.querySelector('.legend').offsetHeight : 0;
  var headerH = par.querySelector('.plot-header') ? par.querySelector('.plot-header').offsetHeight : 0;
  var W = par.clientWidth;
  var H = par.clientHeight - legendH - headerH - 4;
  canvas.width = W;
  canvas.height = Math.max(H, 80);
  var ctx = canvas.getContext('2d');

  if (!simResults) { ctx.clearRect(0, 0, W, canvas.height); return; }

  var results = simResults.results;
  var wn = simResults.params.wn;
  var mob = W < 500;
  var pad = mob ? { l: 36, r: 12, t: 10, b: 24 } : { l: 50, r: 16, t: 12, b: 30 };
  var pw = W - pad.l - pad.r;
  var ph = canvas.height - pad.t - pad.b;
  var fs = mob ? 8 : 10;

  // Determine axis range from all poles
  var allRe = [0], allIm = [0];
  for (var i = 0; i < results.length; i++) {
    var poles = results[i].poles;
    for (var j = 0; j < poles.length; j++) {
      allRe.push(poles[j].re);
      allIm.push(poles[j].im);
    }
  }
  // Include wn circle
  allRe.push(-wn * 1.1);
  allRe.push(wn * 0.3);
  allIm.push(wn * 1.1);
  allIm.push(-wn * 1.1);

  var reMin = Math.min.apply(null, allRe);
  var reMax = Math.max.apply(null, allRe);
  var imAbsMax = Math.max.apply(null, allIm.map(Math.abs));

  var reRange = Math.max(reMax - reMin, 1) * 1.3;
  var reMid = (reMax + reMin) / 2;
  var imRange = Math.max(imAbsMax * 2, 1) * 1.3;

  // Aspect ratio correction
  var aspectData = reRange / imRange;
  var aspectPlot = pw / ph;
  if (aspectData > aspectPlot) {
    imRange = reRange / aspectPlot;
  } else {
    reRange = imRange * aspectPlot;
  }

  var rLo = reMid - reRange / 2;
  var rHi = reMid + reRange / 2;
  var iHi = imRange / 2;
  var iLo = -iHi;

  var toX = function(re) { return pad.l + (re - rLo) / (rHi - rLo) * pw; };
  var toY = function(im) { return pad.t + (1 - (im - iLo) / (iHi - iLo)) * ph; };

  ctx.clearRect(0, 0, W, canvas.height);

  // Stable region (left half plane)
  var zeroX = toX(0);
  if (zeroX > pad.l) {
    ctx.fillStyle = 'rgba(22,163,74,0.06)';
    ctx.fillRect(pad.l, pad.t, Math.min(zeroX - pad.l, pw), ph);
  }

  // Grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var gy = pad.t + i * ph / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy); ctx.stroke();
  }
  for (var i = 0; i <= 6; i++) {
    var gx = pad.l + i * pw / 6;
    ctx.beginPath(); ctx.moveTo(gx, pad.t); ctx.lineTo(gx, pad.t + ph); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  if (toY(0) >= pad.t && toY(0) <= pad.t + ph) {
    ctx.beginPath(); ctx.moveTo(pad.l, toY(0)); ctx.lineTo(W - pad.r, toY(0)); ctx.stroke();
  }
  if (zeroX >= pad.l && zeroX <= W - pad.r) {
    ctx.beginPath(); ctx.moveTo(zeroX, pad.t); ctx.lineTo(zeroX, pad.t + ph); ctx.stroke();
  }

  // wn circle (dashed)
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  var cx0 = toX(0), cy0 = toY(0);
  var rx = Math.abs(toX(wn) - toX(0));
  var ry = Math.abs(toY(wn) - toY(0));
  ctx.beginPath();
  ctx.ellipse(cx0, cy0, rx, ry, 0, 0, 2 * Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // wn label
  ctx.fillStyle = '#94a3b8';
  ctx.font = (mob ? 7 : 9) + 'px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('ωn=' + fN2(wn), toX(-wn) - 4, toY(0) - 6);

  // Zeta lines from origin (radial lines in LHP)
  var zetaValues = [];
  for (var i = 0; i < results.length; i++) {
    var z = results[i].pattern.zeta;
    // Avoid duplicate zeta lines
    var dup = false;
    for (var j = 0; j < zetaValues.length; j++) {
      if (Math.abs(zetaValues[j].zeta - z) < 0.001) { dup = true; break; }
    }
    if (!dup) {
      zetaValues.push({ zeta: z, color: results[i].pattern.color });
    }
  }

  var realAxisLabelIdx = 0;
  for (var i = 0; i < zetaValues.length; i++) {
    var z = zetaValues[i].zeta;
    var col = zetaValues[i].color;
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);

    if (z < 1) {
      // Angle from negative real axis: theta = acos(zeta)
      var theta = Math.acos(z);
      // Line in upper half plane
      var lineLen = wn * 1.3;
      var endRe = -lineLen * Math.cos(theta);
      var endIm = lineLen * Math.sin(theta);
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(0));
      ctx.lineTo(toX(endRe), toY(endIm));
      ctx.stroke();
      // Mirror in lower half plane
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(0));
      ctx.lineTo(toX(endRe), toY(-endIm));
      ctx.stroke();

      // Label
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = col;
      ctx.font = (mob ? 7 : 9) + 'px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('ζ=' + fN2(z), toX(endRe) + 3, toY(endIm) - 3);
    } else {
      // For zeta >= 1, poles are on the real axis; draw along negative real axis
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(0));
      ctx.lineTo(toX(-wn * 1.3), toY(0));
      ctx.stroke();

      // Label (stacked vertically for multiple overdamped patterns)
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = col;
      ctx.font = (mob ? 7 : 9) + 'px sans-serif';
      ctx.textAlign = 'center';
      var labelOffset = -5 - realAxisLabelIdx * 11;
      ctx.fillText('ζ=' + fN2(z), toX(-wn * 0.7), toY(0) + labelOffset);
      realAxisLabelIdx++;
    }

    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // Border
  ctx.strokeStyle = '#d4dde6';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad.l, pad.t, pw, ph);

  // Axis labels
  ctx.fillStyle = '#5b7184';
  ctx.font = fs + 'px monospace';
  ctx.textAlign = 'center';
  for (var i = 0; i <= 4; i++) {
    var re = rLo + i * (rHi - rLo) / 4;
    ctx.fillText(fN2(re), pad.l + i * pw / 4, canvas.height - pad.b + 14);
  }
  ctx.textAlign = 'center';
  ctx.fillText('Re', W - pad.r - 10, toY(0) - 4);
  ctx.fillText('Im', toX(0) + (mob ? 10 : 14), pad.t + 10);

  // Plot poles for each pattern
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var poles = r.poles;
    ctx.fillStyle = r.pattern.color;

    for (var j = 0; j < poles.length; j++) {
      var px = toX(poles[j].re);
      var py = toY(poles[j].im);

      // Filled circle
      ctx.beginPath();
      ctx.arc(px, py, mob ? 5 : 6, 0, 2 * Math.PI);
      ctx.fill();

      // White outline for visibility
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, mob ? 5 : 6, 0, 2 * Math.PI);
      ctx.stroke();

      // Colored outline
      ctx.strokeStyle = r.pattern.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, mob ? 5 : 6, 0, 2 * Math.PI);
      ctx.stroke();
    }
  }
}

// =========================================================
// 時間応答プロット描画
// =========================================================
function drawResponse() {
  var canvas = document.getElementById('responseCanvas');
  var par = canvas.parentElement;
  var legendH = par.querySelector('.legend') ? par.querySelector('.legend').offsetHeight : 0;
  var headerH = par.querySelector('.plot-header') ? par.querySelector('.plot-header').offsetHeight : 0;
  var W = par.clientWidth;
  var H = par.clientHeight - legendH - headerH - 4;
  canvas.width = W;
  canvas.height = Math.max(H, 100);
  var ctx = canvas.getContext('2d');

  if (!simResults) { ctx.clearRect(0, 0, W, canvas.height); return; }

  var results = simResults.results;
  var tEnd = simResults.params.tEnd;
  var distType = simResults.params.distType;
  var mob = W < 500;
  var pad = mob ? { l: 36, r: 8, t: 10, b: 26 } : { l: 50, r: 14, t: 12, b: 32 };
  var pw = W - pad.l - pad.r;
  var ph = canvas.height - pad.t - pad.b;
  var fsize = mob ? 8 : 10;

  // Determine y range
  var rawMax = -Infinity, rawMin = Infinity;
  for (var i = 0; i < results.length; i++) {
    var sim = results[i].sim;
    for (var j = 0; j < sim.y.length; j++) {
      if (sim.y[j] > rawMax) rawMax = sim.y[j];
      if (sim.y[j] < rawMin) rawMin = sim.y[j];
    }
  }
  var margin = Math.max((rawMax - rawMin) * 0.15, 0.01);
  var yMax = rawMax + margin;
  var yMin = rawMin - margin;
  if (yMin > -margin) yMin = -margin;
  if (yMax < margin) yMax = margin;

  var toX = function(t) { return pad.l + (t / tEnd) * pw; };
  var toY = function(v) { return pad.t + (1 - (v - yMin) / (yMax - yMin)) * ph; };

  ctx.clearRect(0, 0, W, canvas.height);

  // Grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var gy = pad.t + i * ph / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy); ctx.stroke();
  }
  for (var i = 0; i <= 5; i++) {
    var gx = pad.l + i * pw / 5;
    ctx.beginPath(); ctx.moveTo(gx, pad.t); ctx.lineTo(gx, pad.t + ph); ctx.stroke();
  }

  // Zero line
  if (toY(0) >= pad.t && toY(0) <= pad.t + ph) {
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(pad.l, toY(0));
    ctx.lineTo(W - pad.r, toY(0));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // For step response: show steady-state and settling band
  // Note: cp = wn^2*m - k for ALL patterns (same wn), so y_ss = -1/(k+cp) = -1/(wn^2*m) is identical
  if (distType === 'step' && results.length > 0) {
    var yss = results[0].perf.yss;
    if (isFinite(yss) && toY(yss) >= pad.t && toY(yss) <= pad.t + ph) {
      // y_ss dashed line
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(pad.l, toY(yss));
      ctx.lineTo(W - pad.r, toY(yss));
      ctx.stroke();
      ctx.setLineDash([]);

      // y_ss label
      ctx.fillStyle = '#5b7184';
      ctx.font = (mob ? 7 : 9) + 'px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('y_ss=' + fN3(yss), pad.l + 4, toY(yss) - 4);

      // 2% settling band (faint gray)
      var band = 0.02 * Math.abs(yss);
      ctx.fillStyle = '#94a3b8';
      ctx.globalAlpha = 0.08;
      var bandTop = toY(yss + band);
      var bandBot = toY(yss - band);
      ctx.fillRect(pad.l, bandTop, pw, bandBot - bandTop);
      ctx.globalAlpha = 1;

      // Band label
      ctx.fillStyle = '#5b7184';
      ctx.font = (mob ? 6 : 8) + 'px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('±2%', W - pad.r - 4, bandTop - 2);
    }
  }

  // Border
  ctx.strokeStyle = '#d4dde6';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad.l, pad.t, pw, ph);

  // Axis labels
  ctx.fillStyle = '#5b7184';
  ctx.font = fsize + 'px monospace';
  ctx.textAlign = 'center';
  var tSteps = mob ? 4 : 5;
  for (var i = 0; i <= tSteps; i++) {
    ctx.fillText((i * tEnd / tSteps).toFixed(1), pad.l + i * pw / tSteps, canvas.height - pad.b + 14);
  }
  ctx.textAlign = 'right';
  for (var i = 0; i <= 4; i++) {
    var v = yMax - i * (yMax - yMin) / 4;
    ctx.fillText(fN2(v), pad.l - 3, pad.t + i * ph / 4 + 4);
  }
  ctx.textAlign = 'center';
  ctx.fillText('t [s]', W - pad.r, canvas.height - pad.b + 14);

  // Plot each pattern's response
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var sim = r.sim;
    ctx.strokeStyle = r.pattern.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var j = 0; j < sim.t.length; j++) {
      var px = toX(sim.t[j]);
      var py = toY(sim.y[j]);
      if (py < pad.t - 5 || py > pad.t + ph + 5) {
        if (j > 0) ctx.moveTo(px, Math.max(pad.t, Math.min(pad.t + ph, py)));
        continue;
      }
      j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

// =========================================================
// バーチャート描画
// =========================================================
function drawBarChart() {
  var canvas = document.getElementById('barCanvas');
  var par = canvas.parentElement;
  var headerH = par.querySelector('.plot-header') ? par.querySelector('.plot-header').offsetHeight : 0;
  var W = par.clientWidth;
  var H = par.clientHeight - headerH - 4;
  canvas.width = W;
  canvas.height = Math.max(H, 60);
  var ctx = canvas.getContext('2d');

  if (!simResults) { ctx.clearRect(0, 0, W, canvas.height); return; }

  var results = simResults.results;
  var distType = simResults.params.distType;
  var isStep = distType === 'step';
  var mob = W < 500;

  ctx.clearRect(0, 0, W, canvas.height);

  // Layout: two groups side by side (overshoot + settling time for step; just settling for impulse)
  var numGroups = isStep ? 2 : 1;
  var labelW = mob ? 80 : 100;
  var rightPad = mob ? 8 : 16;
  var topPad = 10;
  var botPad = 8;
  var groupGap = mob ? 12 : 24;
  var titleH = mob ? 14 : 18;

  var availH = canvas.height - topPad - botPad - titleH;
  var barH = Math.min(16, Math.max(8, (availH - (results.length - 1) * 3) / results.length));
  var barGap = Math.min(3, barH * 0.3);
  var groupH = results.length * (barH + barGap);

  // Compute max values for scaling
  var maxOS = 0, maxTs = 0;
  for (var i = 0; i < results.length; i++) {
    if (isStep && !isNaN(results[i].perf.overshoot) && results[i].perf.overshoot > maxOS) {
      maxOS = results[i].perf.overshoot;
    }
    if (results[i].perf.settlingTime > maxTs) maxTs = results[i].perf.settlingTime;
  }
  if (maxOS < 1) maxOS = 1;
  if (maxTs < 0.1) maxTs = 0.1;

  // Each group gets equal horizontal space after labels
  var totalBarAreaW = W - labelW - rightPad - (numGroups > 1 ? groupGap : 0);
  var barAreaW = totalBarAreaW / numGroups;
  if (barAreaW < 50) barAreaW = 50;

  // Vertical centering
  var startY = topPad + titleH + (availH - groupH) / 2;
  if (startY < topPad + titleH) startY = topPad + titleH;

  var drawGroup = function(groupIdx, title, values, maxVal, unit) {
    // Horizontal offset: label area + group area
    var gx = labelW + groupIdx * (barAreaW + groupGap);
    var valSpaceW = barAreaW - (mob ? 45 : 55);
    if (valSpaceW < 30) valSpaceW = 30;

    // Group title above bars
    ctx.fillStyle = '#5b7184';
    ctx.font = 'bold ' + (mob ? 9 : 11) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(title, gx, startY - 4);

    for (var i = 0; i < results.length; i++) {
      var by = startY + i * (barH + barGap);
      var r = results[i];
      var val = values[i];
      var barW = isNaN(val) ? 0 : (val / maxVal) * valSpaceW;
      if (barW < 0) barW = 0;
      if (!isFinite(barW)) barW = 0;

      // Pattern name label (only for groupIdx 0 to avoid duplication)
      if (groupIdx === 0) {
        ctx.fillStyle = r.pattern.color;
        ctx.font = (mob ? 8 : 10) + 'px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(r.pattern.name, labelW - 6, by + barH * 0.75);
      }

      // Bar background
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(gx, by, valSpaceW, barH);

      // Bar
      ctx.fillStyle = r.pattern.color;
      ctx.globalAlpha = 0.7;
      ctx.fillRect(gx, by, barW, barH);
      ctx.globalAlpha = 1;

      // Bar outline
      ctx.strokeStyle = r.pattern.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(gx, by, barW, barH);

      // Value label
      ctx.fillStyle = '#1f2d3a';
      ctx.font = (mob ? 8 : 10) + 'px monospace';
      ctx.textAlign = 'left';
      var valText = isNaN(val) ? '-' : fN2(val) + unit;
      ctx.fillText(valText, gx + barW + 4, by + barH * 0.75);
    }
  };

  if (isStep) {
    var osValues = results.map(function(r) { return r.perf.overshoot; });
    var tsValues = results.map(function(r) { return r.perf.settlingTime; });
    drawGroup(0, 'オーバーシュート [%]', osValues, maxOS, '%');
    drawGroup(1, '整定時間 (2%) [s]', tsValues, maxTs, 's');
  } else {
    var tsValues = results.map(function(r) { return r.perf.settlingTime; });
    drawGroup(0, '整定時間 (2%) [s]', tsValues, maxTs, 's');
  }
}

// =========================================================
// 除振台アニメーション描画
// =========================================================
function drawAnimPanel(frameIdx) {
  var canvas = document.getElementById('animCanvas');
  var par = canvas.parentElement;
  var headerH = par.querySelector('.plot-header') ? par.querySelector('.plot-header').offsetHeight : 0;
  var controlsH = par.querySelector('.anim-controls') ? par.querySelector('.anim-controls').offsetHeight : 0;
  var W = par.clientWidth;
  var H = par.clientHeight - headerH - controlsH - 4;
  canvas.width = W;
  canvas.height = Math.max(H, 80);
  var ctx = canvas.getContext('2d');

  if (!simResults) { ctx.clearRect(0, 0, W, canvas.height); return; }

  var results = simResults.results;
  var idx = frameIdx !== undefined ? frameIdx : animFrame;
  var mob = W < 500;

  ctx.clearRect(0, 0, W, canvas.height);

  if (results.length === 0) return;

  // Determine visual scale from all patterns' y data
  var allMax = 0;
  for (var i = 0; i < results.length; i++) {
    var sim = results[i].sim;
    for (var j = 0; j < sim.y.length; j++) {
      if (Math.abs(sim.y[j]) > allMax) allMax = Math.abs(sim.y[j]);
    }
  }
  if (allMax < 0.001) allMax = 0.1;
  var maxPixels = Math.min(H * 0.25, 80);
  var vscale = maxPixels / allMax;

  // Layout: evenly space systems across canvas width
  var nSys = results.length;
  var sysW = Math.min(W * 0.42, (W - 20) / nSys);
  var totalW = sysW * nSys;
  var startX = (W - totalW) / 2 + sysW / 2;

  for (var i = 0; i < nSys; i++) {
    var r = results[i];
    var sim = r.sim;
    var safeIdx = Math.min(idx, sim.y.length - 1);
    var yVal = sim.y[safeIdx];
    var tNow = sim.t[safeIdx];
    var cx = startX + i * sysW;

    drawVibSystem(ctx, cx, sysW, H, yVal, vscale, r.pattern.color, r.pattern.name, tNow, mob, true, simResults.params);

    // Show disturbance arrow
    var distType = simResults.params.distType;
    if (distType === 'impulse' && tNow < simResults.params.dt * 5) {
      drawDistArrow(ctx, cx, H, mob);
    } else if (distType === 'step') {
      drawDistArrow(ctx, cx, H, mob);
    }
  }
}

function drawVibSystem(ctx, cx, sysW, H, yVal, vscale, color, label, tNow, mob, showActuator, params) {
  var groundY = H * 0.88;
  var restMassY = H * 0.30;
  var massH = mob ? 18 : 24;
  var massW = sysW * 0.65;
  var halfW = massW / 2;

  // Displacement: positive y = upward in physical coords, but downward on screen
  var dy = -yVal * vscale;
  var massY = restMassY + dy;

  // Draw ground (fixed base at bottom)
  ctx.strokeStyle = '#5b7184';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - halfW - 10, groundY);
  ctx.lineTo(cx + halfW + 10, groundY);
  ctx.stroke();
  // Hatch marks on ground (downward)
  ctx.lineWidth = 1;
  var hatchCount = 7;
  for (var i = 0; i < hatchCount; i++) {
    var hx = cx - halfW - 10 + i * (massW + 20) / (hatchCount - 1);
    ctx.beginPath();
    ctx.moveTo(hx, groundY);
    ctx.lineTo(hx + 5, groundY + 8);
    ctx.stroke();
  }

  // Spring (left side): from ground up to mass
  var springX = cx - halfW * 0.5;
  var springBot = groundY - 4;
  var springTop = massY + massH / 2 + 2;
  drawSpring(ctx, springX, springTop, springBot, color, 8, mob ? 5 : 7);

  // Damper (middle): from ground up to mass
  var damperX = cx;
  var damperBot = groundY - 4;
  var damperTop = springTop;
  drawDamper(ctx, damperX, damperTop, damperBot, color, mob);

  // Actuator (right side): from ground up to mass
  if (showActuator) {
    var actX = cx + halfW * 0.5;
    var actBot = groundY - 4;
    var actTop = springTop;
    drawActuator(ctx, actX, actTop, actBot, color, mob, params, yVal);
  }

  // Mass block (台: table/platform)
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.15;
  ctx.fillRect(cx - halfW, massY - massH / 2, massW, massH);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - halfW, massY - massH / 2, massW, massH);

  // Mass label
  var fs = mob ? 8 : 10;
  ctx.font = fs + 'px sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText('m', cx, massY + 4);

  // y(t) arrow showing displacement direction
  if (Math.abs(yVal) > 0.001) {
    var arrowX = cx + halfW + 8;
    var arrowFrom = restMassY;
    var arrowTo = massY;
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(arrowX, arrowFrom);
    ctx.lineTo(arrowX, arrowTo);
    ctx.stroke();
    var arrowDir = arrowTo < arrowFrom ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(arrowX, arrowTo);
    ctx.lineTo(arrowX - 3, arrowTo - arrowDir * 5);
    ctx.lineTo(arrowX + 3, arrowTo - arrowDir * 5);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = (mob ? 7 : 9) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('y', arrowX + 4, (arrowFrom + arrowTo) / 2 + 3);
  }

  // Label below ground
  ctx.font = (mob ? 9 : 11) + 'px sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(label, cx, H * 0.98);

  // Rest position line (dashed)
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(cx - halfW - 6, restMassY);
  ctx.lineTo(cx + halfW + 6, restMassY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawSpring(ctx, x, top, bot, color, amplitude, zigzags) {
  var len = bot - top;
  if (len < 10) len = 10;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, top);
  // lead-in
  var leadIn = len * 0.08;
  ctx.lineTo(x, top + leadIn);
  // zigzags
  var zigLen = (len - 2 * leadIn) / zigzags;
  for (var i = 0; i < zigzags; i++) {
    var zy = top + leadIn + i * zigLen;
    var dir = (i % 2 === 0) ? 1 : -1;
    ctx.lineTo(x + dir * amplitude, zy + zigLen / 2);
    if (i === zigzags - 1) {
      ctx.lineTo(x, zy + zigLen);
    }
  }
  // lead-out
  ctx.lineTo(x, bot);
  ctx.stroke();
}

function drawDamper(ctx, x, top, bot, color, mob) {
  var len = bot - top;
  if (len < 20) len = 20;
  var cylW = mob ? 10 : 14;
  var cylH = len * 0.3;
  var cylTop = top + len * 0.35;

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;

  // Rod from ceiling to cylinder top
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, cylTop);
  ctx.stroke();

  // Cylinder body
  ctx.strokeRect(x - cylW / 2, cylTop, cylW, cylH);

  // Piston rod from cylinder bottom to mass
  var pistonY = cylTop + cylH;
  ctx.beginPath();
  ctx.moveTo(x, pistonY);
  ctx.lineTo(x, bot);
  ctx.stroke();

  // Piston head inside cylinder
  var headY = cylTop + cylH * 0.35;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - cylW / 2 + 2, headY);
  ctx.lineTo(x + cylW / 2 - 2, headY);
  ctx.stroke();
  ctx.lineWidth = 1.5;
}

function drawActuator(ctx, x, top, bot, color, mob, params, yVal) {
  var len = bot - top;
  if (len < 20) len = 20;
  var midY = (top + bot) / 2;
  var r = mob ? 6 : 9;

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;

  // Rod from ceiling
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, midY - r);
  ctx.stroke();

  // Circle (actuator body)
  ctx.beginPath();
  ctx.arc(x, midY, r, 0, 2 * Math.PI);
  ctx.stroke();

  // Rod to mass
  ctx.beginPath();
  ctx.moveTo(x, midY + r);
  ctx.lineTo(x, bot);
  ctx.stroke();

  // Bidirectional arrow inside circle
  var arrowLen = r * 0.65;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, midY - arrowLen);
  ctx.lineTo(x, midY + arrowLen);
  ctx.stroke();
  // arrowhead up
  ctx.beginPath();
  ctx.moveTo(x, midY - arrowLen);
  ctx.lineTo(x - 2.5, midY - arrowLen + 4);
  ctx.lineTo(x + 2.5, midY - arrowLen + 4);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  // arrowhead down
  ctx.beginPath();
  ctx.moveTo(x, midY + arrowLen);
  ctx.lineTo(x - 2.5, midY + arrowLen - 4);
  ctx.lineTo(x + 2.5, midY + arrowLen - 4);
  ctx.closePath();
  ctx.fill();

  // "u" label
  var fs = mob ? 7 : 9;
  ctx.font = fs + 'px sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.fillText('u', x + r + 3, midY + 3);
}

function drawDistArrow(ctx, cx, H, mob) {
  // Arrow pointing downward from above onto the mass to represent f(t)
  var arrowX = cx;
  var arrowTop = H * 0.05;
  var arrowBot = H * 0.20;
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(arrowX, arrowTop);
  ctx.lineTo(arrowX, arrowBot);
  ctx.stroke();
  // arrowhead pointing down
  ctx.beginPath();
  ctx.moveTo(arrowX, arrowBot);
  ctx.lineTo(arrowX - 5, arrowBot - 7);
  ctx.lineTo(arrowX + 5, arrowBot - 7);
  ctx.closePath();
  ctx.fillStyle = '#dc2626';
  ctx.fill();
  // f(t) label
  var fs = mob ? 8 : 10;
  ctx.font = 'bold ' + fs + 'px sans-serif';
  ctx.fillStyle = '#dc2626';
  ctx.textAlign = 'center';
  ctx.fillText('f(t)', arrowX, arrowTop - 4);
}

// =========================================================
// アニメーション制御
// =========================================================
var SPEEDS = [0.5, 1, 2];

function getSpeed() {
  return SPEEDS[+document.getElementById('speed').value];
}

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speed-label').textContent = getSpeed() + 'x';
});

function togglePlay() {
  if (!simResults) return;
  if (animPlaying) {
    stopAnimation();
  } else {
    // Find the max simulation length across all results
    var maxLen = 0;
    for (var i = 0; i < simResults.results.length; i++) {
      if (simResults.results[i].sim.y.length > maxLen) maxLen = simResults.results[i].sim.y.length;
    }
    if (animFrame >= maxLen - 1) {
      animFrame = 0;
    }
    animPlaying = true;
    document.getElementById('btn-play').innerHTML = '&#x23F8;';
    lastAnimTime = performance.now();
    animRAF = requestAnimationFrame(animStep);
  }
}

function stopAnimation() {
  animPlaying = false;
  document.getElementById('btn-play').innerHTML = '&#x25B6;';
  if (animRAF) {
    cancelAnimationFrame(animRAF);
    animRAF = null;
  }
}

function animStep(now) {
  if (!animPlaying || !simResults) return;

  var dt = simResults.params.dt;
  var speed = getSpeed();
  var elapsed = (now - lastAnimTime) / 1000;
  lastAnimTime = now;

  var framesToAdvance = Math.max(1, Math.round(elapsed / dt * speed));

  // Find max simulation length
  var maxLen = 0;
  for (var i = 0; i < simResults.results.length; i++) {
    if (simResults.results[i].sim.y.length > maxLen) maxLen = simResults.results[i].sim.y.length;
  }

  animFrame = Math.min(animFrame + framesToAdvance, maxLen - 1);

  drawAnimPanel(animFrame);
  updateAnimInfo();

  if (animFrame >= maxLen - 1) {
    stopAnimation();
    return;
  }

  animRAF = requestAnimationFrame(animStep);
}

function updateAnimInfo() {
  if (!simResults || simResults.results.length === 0) return;
  var sim0 = simResults.results[0].sim;
  var safeIdx = Math.min(animFrame, sim0.t.length - 1);
  var t = sim0.t[safeIdx];
  document.getElementById('anim-info').textContent = 't=' + fN2(t);
  document.getElementById('anim-sub').textContent = 't = ' + fN2(t) + ' s';
}

// =========================================================
// リサイズ対応
// =========================================================
var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (simResults) {
      drawAnimPanel(animFrame);
      drawSplane();
      drawResponse();
      drawBarChart();
    }
  }, 80);
});

// =========================================================
// 初期実行
// =========================================================
runSimulation();
</script>
