<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modbus/TCP 制御通信シミュレータ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
  background: #eef2f6;
  color: #1f2d3a;
  min-height: 100vh;
  min-height: 100dvh;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #d4dde6;
  padding: 14px 24px;
  text-align: center;
}
header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: #2e7dd1;
  margin-bottom: 2px;
}
header .subtitle {
  font-size: 0.78rem;
  color: #5b7184;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 20px 40px;
}

/* ─── System Diagram ────────────────────────────── */
.diagram-card {
  background: #ffffff;
  border: 1px solid #d4dde6;
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.3s;
}
.diagram-card.attack-active {
  animation: pulseRed 2s ease-in-out infinite;
}
@keyframes pulseRed {
  0%, 100% { box-shadow: inset 0 0 0 0 rgba(220, 38, 38, 0); }
  50% { box-shadow: inset 0 0 20px 0 rgba(220, 38, 38, 0.08); }
}
.diagram-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #2e7dd1;
  margin-bottom: 12px;
  text-align: center;
}

.diagram-svg {
  width: 100%;
  height: 150px;
  display: block;
}

/* ─── Middle columns ────────────────────────────── */
.middle-row {
  display: flex;
  gap: 18px;
  margin-bottom: 18px;
}
.col-graph, .col-log {
  flex: 1;
  min-width: 0;
}

.panel-card {
  background: #ffffff;
  border: 1px solid #d4dde6;
  border-radius: 10px;
  padding: 18px 20px;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.panel-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #2e7dd1;
  margin-bottom: 12px;
}

/* ─── PID Graph ─────────────────────────────────── */
.graph-container {
  flex: 1;
  min-height: 280px;
  position: relative;
}
.graph-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.graph-legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 8px;
  font-size: 0.7rem;
  color: #5b7184;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.legend-swatch {
  width: 20px;
  height: 3px;
  border-radius: 2px;
}
.legend-swatch.sp { background: #2e7dd1; }
.legend-swatch.pv { background: #dc2626; }
.legend-swatch.mv { background: #f59e0b; }
.legend-swatch.sp { border-top: 2px dashed #2e7dd1; background: none; height: 0; }

/* ─── Packet Log ────────────────────────────────── */
.log-container {
  flex: 1;
  min-height: 200px;
  max-height: 320px;
  overflow-y: auto;
  font-family: 'Courier New', Consolas, monospace;
  font-size: 0.68rem;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  background: #f8fafc;
}
.log-header {
  display: flex;
  background: #e2e8f0;
  padding: 5px 8px;
  font-weight: 700;
  font-size: 0.62rem;
  color: #475569;
  position: sticky;
  top: 0;
  z-index: 1;
}
.log-header span {
  flex-shrink: 0;
}
.log-col-time { width: 60px; }
.log-col-dir { width: 80px; }
.log-col-fc { width: 40px; }
.log-col-info { flex: 1; min-width: 0; }

.log-entries {
  padding: 2px 0;
}
.log-entry {
  display: flex;
  padding: 3px 8px;
  border-bottom: 1px solid #f1f5f9;
  animation: fadeInEntry 0.3s ease;
  line-height: 1.5;
}
@keyframes fadeInEntry {
  from { opacity: 0; background: #dbeafe; }
  to { opacity: 1; background: transparent; }
}
.log-entry span {
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.log-entry.fc03 { color: #1d4ed8; }
.log-entry.fc06 { color: #15803d; }
.log-entry.attack { color: #dc2626; font-weight: 600; }
.log-entry.timeout { color: #dc2626; opacity: 0.7; }

/* ─── Controls ──────────────────────────────────── */
.controls-card {
  background: #ffffff;
  border: 1px solid #d4dde6;
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 18px;
}
.controls-row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}
.ctrl-btn {
  border: none;
  border-radius: 8px;
  padding: 10px 22px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  color: #fff;
  min-height: 42px;
}
.ctrl-btn:active { transform: scale(0.97); }
.ctrl-btn.start { background: #2e7dd1; }
.ctrl-btn.start:hover { background: #2569b3; }
.ctrl-btn.pause { background: #f59e0b; }
.ctrl-btn.pause:hover { background: #d97706; }

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: #5b7184;
}
.ctrl-group label {
  font-weight: 600;
  white-space: nowrap;
}
.ctrl-group input[type="number"] {
  width: 65px;
  padding: 6px 8px;
  border: 2px solid #d4dde6;
  border-radius: 6px;
  font-size: 0.82rem;
  text-align: center;
  color: #1f2d3a;
  font-weight: 600;
}
.ctrl-group input[type="number"]:focus {
  outline: none;
  border-color: #2e7dd1;
}
.ctrl-group select {
  padding: 6px 10px;
  border: 2px solid #d4dde6;
  border-radius: 6px;
  font-size: 0.78rem;
  color: #1f2d3a;
  background: #fff;
  cursor: pointer;
}
.ctrl-group select:focus {
  outline: none;
  border-color: #2e7dd1;
}

.speed-btns {
  display: flex;
  gap: 4px;
}
.speed-btn {
  background: #e2e8f0;
  border: 2px solid transparent;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  transition: all 0.15s;
}
.speed-btn:hover {
  border-color: #2e7dd1;
  color: #2e7dd1;
}
.speed-btn.active {
  background: #2e7dd1;
  color: #fff;
  border-color: #2e7dd1;
}

/* Attack mode selector */
.attack-select {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.attack-btn {
  background: #ffffff;
  border: 2px solid #d4dde6;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.75rem;
  font-weight: 600;
  color: #5b7184;
  cursor: pointer;
  transition: all 0.2s;
}
.attack-btn:hover {
  border-color: #dc2626;
  color: #dc2626;
}
.attack-btn.active {
  border-color: #16a34a;
  background: #16a34a;
  color: #fff;
}
.attack-btn.active-dos {
  border-color: #dc2626;
  background: #dc2626;
  color: #fff;
}
.attack-btn.active-replay {
  border-color: #f59e0b;
  background: #f59e0b;
  color: #fff;
}

/* Attack explanation */
.attack-desc {
  background: #ffffff;
  border: 1px solid #d4dde6;
  border-radius: 8px;
  padding: 10px 16px;
  margin-top: 10px;
  font-size: 0.78rem;
  color: #5b7184;
  line-height: 1.65;
  transition: opacity 0.3s;
}
.attack-desc strong { color: #1f2d3a; }
.attack-desc.hidden { display: none; }

/* ─── Mobile ────────────────────────────────────── */
@media (max-width: 820px) {
  header { padding: 10px 14px; }
  header h1 { font-size: 1rem; }
  header .subtitle { font-size: 0.7rem; }
  .container { padding: 10px 10px 30px; }
  .middle-row {
    flex-direction: column;
  }
  .ctrl-btn {
    padding: 10px 16px;
    font-size: 0.82rem;
    min-height: 44px;
  }
  .ctrl-group input[type="number"],
  .ctrl-group select {
    font-size: 16px; /* prevent iOS zoom */
  }
  .attack-btn {
    font-size: 16px;
    padding: 8px 14px;
  }
  .speed-btn {
    font-size: 16px;
    padding: 8px 12px;
  }
  .diagram-svg {
    height: 130px;
  }
  .graph-container {
    min-height: 240px;
  }
  .log-container {
    min-height: 180px;
    max-height: 250px;
  }
  .controls-card {
    margin-bottom: 12px;
  }
}

@media (max-width: 480px) {
  .controls-row {
    gap: 6px;
  }
  .diagram-svg {
    height: 110px;
  }
  .graph-container {
    min-height: 200px;
  }
  .log-container {
    min-height: 150px;
    max-height: 200px;
  }
}
</style>
</head>
<body>

<header>
  <h1>Modbus/TCP 制御通信シミュレータ</h1>
  <div class="subtitle">空気浮上系のHMI&#x21D4;PLC通信と攻撃シミュレーション</div>
</header>

<div class="container">

  <!-- System Diagram -->
  <div class="diagram-card" id="diagramCard">
    <div class="diagram-title">システム構成図</div>
    <svg class="diagram-svg" id="diagramSvg" viewBox="0 0 800 145" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <!-- Controls (グラフ・ログの上に配置) -->
  <div class="controls-card">
    <div class="controls-row">
      <button class="ctrl-btn start" id="btnStart">&#9654; シミュレーション開始</button>

      <div class="ctrl-group">
        <label>SP:</label>
        <input type="number" id="spInput" value="150" min="0" max="300" step="10">
      </div>

      <div class="ctrl-group">
        <label>速度:</label>
        <div class="speed-btns">
          <button class="speed-btn" data-speed="1">1x</button>
          <button class="speed-btn active" data-speed="2">2x</button>
          <button class="speed-btn" data-speed="5">5x</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>攻撃:</label>
        <div class="attack-select">
          <button class="attack-btn active" data-attack="none">正常</button>
          <button class="attack-btn" data-attack="dos">DoS攻撃</button>
          <button class="attack-btn" data-attack="replay">Replay攻撃</button>
        </div>
      </div>
    </div>

    <div class="attack-desc hidden" id="attackDesc"></div>
  </div>

  <!-- Middle: Graph + Log -->
  <div class="middle-row">
    <div class="col-graph">
      <div class="panel-card">
        <div class="panel-title">PID制御グラフ</div>
        <div class="graph-container">
          <canvas id="pidCanvas"></canvas>
        </div>
        <div class="graph-legend">
          <div class="legend-item"><div class="legend-swatch sp"></div> SP (設定値)</div>
          <div class="legend-item"><div class="legend-swatch pv" style="background:#dc2626;height:3px;border:none;"></div> PV (位置)</div>
          <div class="legend-item"><div class="legend-swatch mv" style="background:#f59e0b;height:3px;border:none;"></div> MV (出力)</div>
        </div>
      </div>
    </div>
    <div class="col-log">
      <div class="panel-card">
        <div class="panel-title">Modbusパケットログ</div>
        <div class="log-container" id="logContainer">
          <div class="log-header">
            <span class="log-col-time">Time</span>
            <span class="log-col-dir">Direction</span>
            <span class="log-col-fc">FC</span>
            <span class="log-col-info">Info</span>
          </div>
          <div class="log-entries" id="logEntries"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ================================================================
   State
   ================================================================ */
var running = false;
var simTime = 0;       // simulation time in ms
var speed = 2;         // 1x, 2x, 5x
var attackMode = 'none'; // 'none', 'dos', 'replay'

// PID state
var SP = 150;
var PV = 0;
var MV = 0;
var pvHistory = [];
var spHistory = [];
var mvHistory = [];
var maxHistory = 200;

// Attack state
var dosActive = false;
var replayFired = false;
var replayTimer = 0;
var stalePV = null;
var staleMV = null;
var dosResponseDelay = 0;

// Packet log
var logCount = 0;
var transactionId = 0;

// Timing
var lastFrameTime = 0;
var simInterval = null;
var animFrameId = null;

/* ================================================================
   DOM References
   ================================================================ */
var $btnStart = document.getElementById('btnStart');
var $spInput = document.getElementById('spInput');
var $logEntries = document.getElementById('logEntries');
var $logContainer = document.getElementById('logContainer');
var $diagramCard = document.getElementById('diagramCard');
var $attackDesc = document.getElementById('attackDesc');
var $canvas = document.getElementById('pidCanvas');
var ctx = $canvas.getContext('2d');

/* ================================================================
   Attack descriptions
   ================================================================ */
var ATTACK_DESCS = {
  none: '',
  dos: '<strong>DoS攻撃 (Denial of Service):</strong> 攻撃者がPLC宛にTCP SYNパケットを大量送信し、PLCの通信処理能力を飽和させます。HMIからのModbus要求がタイムアウトし、PV値の取得が途絶えます。PLC内部のPID制御は継続しますが、HMIは監視・制御不能になります。',
  replay: '<strong>Replay攻撃 (リプレイ攻撃):</strong> 攻撃者が過去のModbusパケット（FC06 Write SP=0）をキャプチャし、再送信します。PLCは正規のパケットと区別できず、設定値が0に書き換えられます。浮上中のボールが落下する危険な状態になります。'
};

/* ================================================================
   System Diagram (SVG)
   ================================================================ */
function buildDiagram() {
  var svg = document.getElementById('diagramSvg');
  var isAttack = attackMode !== 'none' && running;

  var html = '';

  // Defs: arrow markers
  html += '<defs>';
  html += '<marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94a3b8"/></marker>';
  html += '<marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#94a3b8"/></marker>';
  html += '<marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>';
  html += '</defs>';

  // --- Row 1: HMI -- Network -- PLC -- I/O -- Plant ---
  var rowY = 20;

  // HMI box
  html += '<rect x="30" y="' + rowY + '" width="130" height="55" rx="8" fill="#dbeafe" stroke="#2e7dd1" stroke-width="2"/>';
  html += '<text x="95" y="' + (rowY + 22) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">HMI</text>';
  html += '<text x="95" y="' + (rowY + 37) + '" text-anchor="middle" font-size="9" fill="#3b82f6">(ScadaBR)</text>';
  html += '<text x="95" y="' + (rowY + 50) + '" text-anchor="middle" font-size="7.5" fill="#64748b">192.168.1.10</text>';

  // Network line area
  var lineY = rowY + 27;
  html += '<text x="265" y="' + (lineY - 12) + '" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">Modbus/TCP</text>';

  // Animated packet dots (normal)
  if (running && attackMode !== 'dos') {
    html += '<circle r="4" fill="#2e7dd1"><animateMotion dur="1.5s" repeatCount="indefinite" path="M165,' + lineY + ' L330,' + lineY + '"/></circle>';
    html += '<circle r="4" fill="#16a34a"><animateMotion dur="1.5s" repeatCount="indefinite" path="M330,' + lineY + ' L165,' + lineY + '"/></circle>';
  }
  if (running && attackMode === 'dos') {
    html += '<line x1="160" y1="' + lineY + '" x2="330" y2="' + lineY + '" stroke="#dc2626" stroke-width="3" stroke-dasharray="4,2" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.5s" repeatCount="indefinite"/></line>';
    html += '<text x="265" y="' + (lineY + 14) + '" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="700">BLOCKED</text>';
  }

  // Bidirectional arrows between HMI-PLC
  html += '<path d="M162,' + (lineY - 4) + ' L328,' + (lineY - 4) + '" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowR)" fill="none"/>';
  html += '<path d="M328,' + (lineY + 4) + ' L162,' + (lineY + 4) + '" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowL)" fill="none"/>';

  // PLC box
  html += '<rect x="330" y="' + rowY + '" width="130" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>';
  html += '<text x="395" y="' + (rowY + 22) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">PLC</text>';
  html += '<text x="395" y="' + (rowY + 37) + '" text-anchor="middle" font-size="9" fill="#22c55e">(OpenPLC)</text>';
  html += '<text x="395" y="' + (rowY + 50) + '" text-anchor="middle" font-size="7.5" fill="#64748b">192.168.1.195:502</text>';

  // I/O arrow
  html += '<line x1="460" y1="' + lineY + '" x2="540" y2="' + lineY + '" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowR)"/>';
  html += '<text x="500" y="' + (lineY - 10) + '" text-anchor="middle" font-size="9" fill="#64748b">I/O</text>';

  // Sensor + Blower box
  html += '<rect x="540" y="' + (rowY + 2) + '" width="120" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>';
  html += '<text x="600" y="' + (rowY + 22) + '" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">距離センサ</text>';
  html += '<text x="600" y="' + (rowY + 38) + '" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">+ ブロワ</text>';

  // --- Attacker node (below the network line) ---
  var atkY = rowY + 75;
  var attackerOpacity = isAttack ? '1' : '0.25';
  var attackerStroke = isAttack ? '#dc2626' : '#94a3b8';
  var attackerFill = isAttack ? '#fef2f2' : '#f8fafc';
  var attackerText = attackMode === 'dos' ? 'DoS Flood' : attackMode === 'replay' ? 'Replay' : '待機中';

  html += '<g opacity="' + attackerOpacity + '">';
  html += '<rect x="190" y="' + atkY + '" width="110" height="42" rx="8" fill="' + attackerFill + '" stroke="' + attackerStroke + '" stroke-width="2"' + (isAttack ? ' stroke-dasharray="4,2"' : '') + '/>';
  html += '<text x="245" y="' + (atkY + 18) + '" text-anchor="middle" font-size="10" font-weight="700" fill="' + (isAttack ? '#dc2626' : '#94a3b8') + '">Attacker</text>';
  html += '<text x="245" y="' + (atkY + 32) + '" text-anchor="middle" font-size="8" fill="' + (isAttack ? '#dc2626' : '#94a3b8') + '">' + attackerText + '</text>';

  // Attack arrow going up to the network line
  if (isAttack) {
    html += '<line x1="245" y1="' + atkY + '" x2="265" y2="' + (rowY + 55 + 4) + '" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>';
    html += '<circle r="3" fill="#dc2626"><animateMotion dur="0.6s" repeatCount="indefinite" path="M245,' + atkY + ' L265,' + (rowY + 58) + '"/></circle>';
  }
  html += '</g>';

  svg.innerHTML = html;
}

/* ================================================================
   PID Graph (Canvas)
   ================================================================ */
function resizeCanvas() {
  var container = $canvas.parentElement;
  var rect = container.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  $canvas.width = rect.width * dpr;
  $canvas.height = rect.height * dpr;
  $canvas.style.width = rect.width + 'px';
  $canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawGraph() {
  var w = $canvas.width / (window.devicePixelRatio || 1);
  var h = $canvas.height / (window.devicePixelRatio || 1);

  ctx.clearRect(0, 0, w, h);

  var padL = 45;
  var padR = 45;
  var padT = 10;
  var padB = 20;
  var gw = w - padL - padR;
  var gh = h - padT - padB;

  // Grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var i = 0; i <= 6; i++) {
    var y = padT + (gh / 6) * i;
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + gw, y);
  }
  ctx.stroke();

  // Y-axis labels (left: SP/PV 0-300)
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  for (var i = 0; i <= 6; i++) {
    var val = 300 - i * 50;
    var y = padT + (gh / 6) * i;
    ctx.fillText(val.toString(), padL - 5, y + 3);
  }

  // Y-axis labels (right: MV 0-65535)
  ctx.textAlign = 'left';
  for (var i = 0; i <= 6; i++) {
    var val = Math.round(65535 - i * (65535 / 6));
    var y = padT + (gh / 6) * i;
    ctx.fillText(val.toString(), padL + gw + 5, y + 3);
  }

  // Axis labels
  ctx.fillStyle = '#64748b';
  ctx.font = '8px sans-serif';
  ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(10, padT + gh / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('SP / PV', 0, 0);
  ctx.restore();
  ctx.save();
  ctx.translate(w - 5, padT + gh / 2);
  ctx.rotate(Math.PI / 2);
  ctx.fillText('MV', 0, 0);
  ctx.restore();

  if (spHistory.length < 2) return;

  var n = spHistory.length;
  var step = gw / (maxHistory - 1);

  // Helper to map values
  function yPV(val) { return padT + gh - (val / 300) * gh; }
  function yMV(val) { return padT + gh - (val / 65535) * gh; }

  // Draw SP (blue dashed)
  ctx.strokeStyle = '#2e7dd1';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var x = padL + (maxHistory - n + i) * step;
    var y = yPV(spHistory[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw PV (red solid)
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var x = padL + (maxHistory - n + i) * step;
    var y = yPV(pvHistory[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Draw MV (orange solid)
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var x = padL + (maxHistory - n + i) * step;
    var y = yMV(mvHistory[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

/* ================================================================
   Packet Log
   ================================================================ */
function addLogEntry(time, dir, fc, info, cls) {
  var timeStr = formatTime(time);
  var row = document.createElement('div');
  row.className = 'log-entry ' + (cls || '');
  row.innerHTML =
    '<span class="log-col-time">' + timeStr + '</span>' +
    '<span class="log-col-dir">' + dir + '</span>' +
    '<span class="log-col-fc">' + fc + '</span>' +
    '<span class="log-col-info">' + info + '</span>';

  // Insert at top
  if ($logEntries.firstChild) {
    $logEntries.insertBefore(row, $logEntries.firstChild);
  } else {
    $logEntries.appendChild(row);
  }

  // Limit entries
  logCount++;
  if (logCount > 200) {
    $logEntries.removeChild($logEntries.lastChild);
    logCount--;
  }
}

function formatTime(ms) {
  var sec = Math.floor(ms / 1000);
  var frac = Math.floor((ms % 1000) / 100);
  var min = Math.floor(sec / 60);
  sec = sec % 60;
  return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec + '.' + frac;
}

/* ================================================================
   Simulation Step
   ================================================================ */
function simStep() {
  var dt = 500; // simulation time per step (ms)
  simTime += dt;

  // Read SP from input
  var newSP = parseInt($spInput.value, 10);
  if (isNaN(newSP)) newSP = SP;
  newSP = Math.max(0, Math.min(300, newSP));

  var spChanged = (newSP !== SP);
  SP = newSP;

  // ─── Attack logic ───
  if (attackMode === 'dos') {
    dosActive = true;
    dosResponseDelay += 50;
    if (dosResponseDelay > 500) dosResponseDelay = 500;
  } else {
    dosActive = false;
    dosResponseDelay = Math.max(0, dosResponseDelay - 100);
  }

  if (attackMode === 'replay' && !replayFired) {
    replayTimer += dt;
    if (replayTimer > 2000) {
      // Fire the replay attack
      replayFired = true;
      transactionId++;
      addLogEntry(simTime, '&#9888; ATK&#8594;PLC', 'FC06', 'Write HR Addr:0 Val:0 &#9888; Replay', 'attack');
      addLogEntry(simTime, 'PLC&#8594;ATK', 'FC06', 'Response OK (SP&#8592;0)', 'attack');
      SP = 0;
      $spInput.value = '0';
    }
  }

  // ─── PID control (runs in PLC, always) ───
  var error = SP - PV;
  var Kp = 2.0;
  var rawMV = Kp * error * 300 + 20000;
  MV = Math.max(0, Math.min(65535, Math.round(rawMV)));

  // PV dynamics: first-order lag toward target + noise
  var targetPV = SP;
  var tau = 0.15; // lag factor per step
  PV = PV + tau * (targetPV - PV) + (Math.random() - 0.5) * 2;
  PV = Math.max(0, Math.min(300, PV));

  // ─── Modbus communication ───
  transactionId++;

  // What the HMI displays (may differ from real PV during DoS)
  var displayPV = PV;
  var displayMV = MV;

  if (dosActive) {
    // DoS: attacker flooding
    addLogEntry(simTime, 'ATK&#8594;PLC', 'SYN', 'TCP SYN flood (port 502) x' + Math.floor(Math.random() * 100 + 50), 'attack');

    // Freeze HMI display at stale values
    if (stalePV === null) stalePV = Math.round(PV);
    if (staleMV === null) staleMV = MV;
    displayPV = stalePV;
    displayMV = staleMV;

    // Some packets time out
    if (Math.random() > 0.3) {
      addLogEntry(simTime, 'HMI&#8594;PLC', 'FC03', 'Read HR Addr:0 Count:3 ... TIMEOUT', 'timeout');
    } else {
      addLogEntry(simTime, 'HMI&#8594;PLC', 'FC03', 'Read HR Addr:0 Count:3 (delayed ' + dosResponseDelay + 'ms)', 'fc03');
      addLogEntry(simTime, 'PLC&#8594;HMI', 'FC03', 'Response [' + SP + ', ' + stalePV + ', ' + staleMV + ']', 'fc03');
    }
  } else {
    stalePV = null;
    staleMV = null;

    // Normal FC03 read
    addLogEntry(simTime, 'HMI&#8594;PLC', 'FC03', 'Read HR Addr:0 Count:3', 'fc03');
    addLogEntry(simTime, 'PLC&#8594;HMI', 'FC03', 'Response [' + SP + ', ' + Math.round(PV) + ', ' + MV + ']', 'fc03');

    // SP change -> FC06 write
    if (spChanged && attackMode !== 'replay') {
      transactionId++;
      addLogEntry(simTime, 'HMI&#8594;PLC', 'FC06', 'Write HR Addr:0 Val:' + SP, 'fc06');
      addLogEntry(simTime, 'PLC&#8594;HMI', 'FC06', 'Response OK', 'fc06');
    }
  }

  // ─── Record history (what HMI sees) ───
  spHistory.push(SP);
  pvHistory.push(displayPV);
  mvHistory.push(displayMV);
  if (spHistory.length > maxHistory) {
    spHistory.shift();
    pvHistory.shift();
    mvHistory.shift();
  }
}

/* ================================================================
   Animation Loop
   ================================================================ */
function animate() {
  drawGraph();
  buildDiagram();
  if (running) {
    animFrameId = requestAnimationFrame(animate);
  }
}

function startSim() {
  if (running) return;
  running = true;
  $btnStart.textContent = '⏸ 一時停止';
  $btnStart.classList.remove('start');
  $btnStart.classList.add('pause');

  // Simulation step interval
  var interval = Math.round(500 / speed);
  simInterval = setInterval(simStep, interval);

  // Render loop
  animFrameId = requestAnimationFrame(animate);
  updateDiagramAttack();
}

function pauseSim() {
  if (!running) return;
  running = false;
  $btnStart.textContent = '▶ シミュレーション再開';
  $btnStart.classList.remove('pause');
  $btnStart.classList.add('start');

  clearInterval(simInterval);
  simInterval = null;
  cancelAnimationFrame(animFrameId);
  animFrameId = null;
  updateDiagramAttack();
}

function toggleSim() {
  if (running) pauseSim();
  else startSim();
}

function updateSpeed(newSpeed) {
  speed = newSpeed;
  if (running) {
    clearInterval(simInterval);
    var interval = Math.round(500 / speed);
    simInterval = setInterval(simStep, interval);
  }
}

function updateDiagramAttack() {
  if (attackMode !== 'none' && running) {
    $diagramCard.classList.add('attack-active');
  } else {
    $diagramCard.classList.remove('attack-active');
  }
}

function setAttackMode(mode) {
  attackMode = mode;
  replayFired = false;
  replayTimer = 0;
  dosResponseDelay = 0;
  stalePV = null;
  staleMV = null;

  // Update button styles
  var btns = document.querySelectorAll('.attack-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.classList.remove('active', 'active-dos', 'active-replay');
    if (b.getAttribute('data-attack') === mode) {
      if (mode === 'dos') b.classList.add('active-dos');
      else if (mode === 'replay') b.classList.add('active-replay');
      else b.classList.add('active');
    }
  }

  // Attack description
  if (ATTACK_DESCS[mode]) {
    $attackDesc.innerHTML = ATTACK_DESCS[mode];
    $attackDesc.classList.remove('hidden');
  } else {
    $attackDesc.classList.add('hidden');
  }

  updateDiagramAttack();
  buildDiagram();

  // If replay and running, add capture log
  if (mode === 'replay' && running) {
    addLogEntry(simTime, '&#9888; CAPTURE', '--', 'Attacker captured FC06 packet (SP=0)', 'attack');
  }
  if (mode === 'dos' && running) {
    addLogEntry(simTime, '&#9888; START', '--', 'DoS attack initiated - TCP SYN flood', 'attack');
  }
  if (mode === 'none' && running) {
    addLogEntry(simTime, '&#9989; STOP', '--', 'Attack stopped - normal operation resumed', 'fc06');
  }
}

/* ================================================================
   Event Listeners
   ================================================================ */
$btnStart.addEventListener('click', toggleSim);

// Speed buttons
var speedBtns = document.querySelectorAll('.speed-btn');
for (var i = 0; i < speedBtns.length; i++) {
  speedBtns[i].addEventListener('click', function() {
    for (var j = 0; j < speedBtns.length; j++) speedBtns[j].classList.remove('active');
    this.classList.add('active');
    updateSpeed(parseInt(this.getAttribute('data-speed'), 10));
  });
}

// Attack buttons
var attackBtns = document.querySelectorAll('.attack-btn');
for (var i = 0; i < attackBtns.length; i++) {
  attackBtns[i].addEventListener('click', function() {
    setAttackMode(this.getAttribute('data-attack'));
  });
}

// SP input change
$spInput.addEventListener('change', function() {
  var val = parseInt(this.value, 10);
  if (isNaN(val)) val = 150;
  val = Math.max(0, Math.min(300, val));
  this.value = val;
});

// Canvas resize
window.addEventListener('resize', function() {
  resizeCanvas();
  drawGraph();
});

/* ================================================================
   Init
   ================================================================ */
(function init() {
  resizeCanvas();
  buildDiagram();
  drawGraph();

  // Initialize history with zeros
  for (var i = 0; i < 10; i++) {
    spHistory.push(150);
    pvHistory.push(0);
    mvHistory.push(0);
  }
  drawGraph();
})();
</script>
